# A normal resource, not a hook: a hook is deleted and recreated on every sync, which would
# garbage-collect the Secret each time.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "seobasics.secretName" . }}
  labels:
    {{- include "seobasics.labels" . | nindent 4 }}
  annotations:
    # Before everything that reads the Secret.
    argocd.argoproj.io/sync-wave: "-20"
    {{- include "seobasics.restartAnnotation" . | nindent 4 }}
spec:
  itemPath: {{ include "seobasics.itemPath" . | quote }}
