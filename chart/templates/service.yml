apiVersion: v1
kind: Service
metadata:
  name: {{ include "seobasics.fullname" . }}
  labels:
    {{- include "seobasics.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "seobasics.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
