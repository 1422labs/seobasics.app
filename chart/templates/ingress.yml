{{- if .Values.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seobasics.fullname" . }}
  labels:
    {{- include "seobasics.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- if .Values.ingress.redirectWww }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
        {{- if .Values.ingress.redirectWww }}
        - {{ printf "www.%s" .Values.host | quote }}
        {{- end }}
      secretName: {{ include "seobasics.fullname" . }}-tls
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "seobasics.fullname" . }}
                port:
                  name: http
{{- end }}
